name: Build V5.1 Android and Windows

on:
  push:
    branches: [v5.1-multiplatform]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mes-Proprietes-V5.1-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows portable app
        run: npm run windows:build
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Mes-Proprietes-V5.1-Windows
          path: dist/*.exe
          if-no-files-found: error
